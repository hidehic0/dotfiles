name: auto update nix flake
on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [nixos]
    paths:
      - ".github/workflows/update-nix-flake.yaml"

jobs:
  update-nix-flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: cachix/install-nix-action@51f3067b56fe8ae331890c77d4e454f6d60615ff # v31.10.2
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - run: nix flake update
      - name: "Import GPG key"
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          fingerprint: 6201116F67AD6FAC
      - uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7.1.0
        with:
          commit_author: "hidehic0 <${{ steps.import-gpg.outputs.email }}>"
          commit_user_name: hidehic0
          commit_user_email: ${{ steps.import-gpg.outputs.email }}
          commit_message: "chore(deps): updated flake.lock"
