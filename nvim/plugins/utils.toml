[[plugins]]
repo = "folke/flash.nvim"
on_map = ["<leader>j", "f", "F", "t", "T"]
lua_source = '''
require("flash").setup({
    modes = {
    char = {
      jump_labels = false,
      multi_line = false,
      highlight = { backdrop = false },
    }
  }
})
vim.keymap.set("n", "<leader>j",function() require("flash").jump() end, {desc = "Flash"})
'''

[[plugins]]
repo = "yuki-yano/fuzzy-motion.vim"
on_cmd = "FuzzyMotion"
on_map = ["<leader>J"]
lua_source = '''
vim.g.fuzzy_motion_matchers = { "fzf", "kensaku" }
vim.keymap.set("n", "<leader>J", "<Cmd>FuzzyMotion<CR>", { desc = "FuzzyMotion" })
'''

[[plugins]]
repo = "kevinhwang91/nvim-hlslens"
on_event = "CmdlineEnter"
lua_source = '''
require('hlslens').setup()

local kopts = {noremap = true, silent = true}

vim.api.nvim_set_keymap('n', 'n',
    [[<Cmd>execute('normal! ' . v:count1 . 'n')<CR><Cmd>lua require('hlslens').start()<CR>]],
    kopts)
vim.api.nvim_set_keymap('n', 'N',
    [[<Cmd>execute('normal! ' . v:count1 . 'N')<CR><Cmd>lua require('hlslens').start()<CR>]],
    kopts)
'''

[[plugins]]
repo = "monaqa/dial.nvim"
on_map = ["<C-x>", "<C-a>", "g<C-x>", "g<C-a>"]
hooks_file = "$HOOK_DIR/dial.lua"

[[plugins]]
repo = "nvim-telescope/telescope.nvim"
depends = ["plenary.nvim"]
on_cmd = "Telescope"
lua_source = '''
require("telescope").setup({})
'''

[[plugins]]
repo = "fdschmidt93/telescope-egrepify.nvim"

[[plugins]]
repo = "obsidian-nvim/obsidian.nvim"
on_ft = "markdown"
on_cmd = ["Obsidian"]
on_map = ["<leader>oo"]
depends = ["telescope.nvim", "telescope-egrepify.nvim", "obsidian-bridge.nvim"]
hooks_file = "$HOOK_DIR/obsidian.lua"

[[plugins]]
repo = "oflisback/obsidian-bridge.nvim"
lua_source = '''
require("obsidian-bridge").setup({
  scroll_sync = true,
})
'''

[[plugins]]
repo = "wakatime/vim-wakatime"
on_event = "VimEnter"

[[plugins]]
repo = "akinsho/git-conflict.nvim"
on_event = "BufReadPost"
lua_source = '''
vim.defer_fn(function()
  require('git-conflict').setup()
end,300)
'''

[[plugins]]
repo = "vim-jp/vimdoc-ja"
on_ft = "help"

[[plugins]]
repo = "kevinhwang91/nvim-ufo"
depends = "nvim-treesitter"
on_map = ["zR", "zo", "zc"]
hooks_file = "$HOOK_DIR/nvim-ufo.lua"

[[plugins]]
repo = "kevinhwang91/promise-async"
on_source = "nvim-ufo"
