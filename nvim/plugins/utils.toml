[[plugins]]
repo = "lambdalisue/vim-kensaku"
on_event = "CmdlineEnter"
depends = "denops.vim"
lua_source = '''
vim.keymap.set("c", "<CR>", "<Plug>(kensaku-search-replace)<CR>")
'''

[[plugins]]
repo = "lambdalisue/vim-kensaku-search"
on_source = ["vim-kensaku", "fuzzy-motion.nvim"]

